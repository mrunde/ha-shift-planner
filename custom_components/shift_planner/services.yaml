create_shift:
  name: Create shift
  description: Create a shift only if the selected day has no calendar events.
  fields:
    config_entry_id:
      name: Shift Planner
      required: true
      selector:
        config_entry:
          integration: shift_planner
    date:
      name: Date
      required: true
      selector:
        date: {}
    shift:
      name: Shift
      description: Name of a shift configured for the selected Shift Planner.
      required: true
      selector:
        text: {}

update_shift:
  name: Update shift
  description: Change the name and hours of the only calendar event on the selected day. Select the date on which the event starts.
  fields:
    config_entry_id:
      name: Shift Planner
      required: true
      selector:
        config_entry:
          integration: shift_planner
    date:
      name: Date
      required: true
      selector:
        date: {}
    shift:
      name: Shift
      description: Name of the configured shift to change the event to.
      required: true
      selector:
        text: {}